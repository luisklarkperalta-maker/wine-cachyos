name: Build Wine-CachyOS WoW64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout trial branch
        uses: actions/checkout@v4
        with:
          ref: trial
          fetch-depth: 0

      - name: Enable i386 architecture
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update

      - name: Install dependencies
        run: |
          sudo apt install -y \
            build-essential \
            gcc-multilib \
            g++-multilib \
            flex \
            bison \
            gettext \
            autoconf \
            automake \
            libtool \
            pkg-config \
            mingw-w64 \
            clang \
            llvm \
            python3 \
            libx11-dev \
            libx11-dev:i386 \
            libfreetype6-dev \
            libfreetype6-dev:i386 \
            libfontconfig1-dev \
            libfontconfig1-dev:i386 \
            libxcursor-dev \
            libxcursor-dev:i386 \
            libxi-dev \
            libxi-dev:i386 \
            libxrandr-dev \
            libxrandr-dev:i386 \
            libxinerama-dev \
            libxinerama-dev:i386 \
            libxcomposite-dev \
            libxcomposite-dev:i386 \
            libxrender-dev \
            libxrender-dev:i386 \
            libxext-dev \
            libxext-dev:i386 \
            libxfixes-dev \
            libxfixes-dev:i386 \
            libxkbcommon-dev \
            libxkbcommon-dev:i386 \
            libglu1-mesa-dev \
            libglu1-mesa-dev:i386 \
            libvulkan-dev \
            libvulkan-dev:i386 \
            libasound2-dev \
            libasound2-dev:i386 \
            libpulse-dev \
            libpulse-dev:i386

      - name: Generate configure
        run: |
          if [ -f autogen.sh ]; then
            chmod +x autogen.sh
            ./autogen.sh
          fi

      - name: Configure
        run: |
          mkdir build
          cd build

          ../configure \
            --enable-archs=i386,x86_64

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Install
        run: |
          cd build
          make install DESTDIR=$GITHUB_WORKSPACE/package

      - name: Create archive
        run: |
          tar -C package -czf wine-cachyos-wow64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-cachyos-wow64
          path: wine-cachyos-wow64.tar.gz
