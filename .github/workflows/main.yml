name: Build Wine-CachyOS WoW64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout trial branch
        uses: actions/checkout@v4
        with:
          ref: trial
          fetch-depth: 0

      - name: Enable i386 architecture
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            gcc-multilib \
            g++-multilib \
            clang \
            llvm \
            flex \
            bison \
            gettext \
            autoconf \
            automake \
            libtool \
            pkg-config \
            mingw-w64 \
            ninja-build \
            python3 \
            python3-pip \
            libdrm-dev \
            libdrm-dev:i386 \
            libpciaccess-dev \
            libpciaccess-dev:i386 \
            libwayland-dev \
            libwayland-dev:i386 \
            libxkbcommon-dev \
            libxkbcommon-dev:i386 \
            libx11-dev \
            libx11-dev:i386 \
            libxext-dev \
            libxext-dev:i386 \
            libxrandr-dev \
            libxrandr-dev:i386 \
            libxrender-dev \
            libxrender-dev:i386 \
            libxfixes-dev \
            libxfixes-dev:i386 \
            libxi-dev \
            libxi-dev:i386 \
            libxcursor-dev \
            libxcursor-dev:i386 \
            libxinerama-dev \
            libxinerama-dev:i386 \
            libxcomposite-dev \
            libxcomposite-dev:i386 \
            libfreetype6-dev \
            libfreetype6-dev:i386 \
            libfontconfig1-dev \
            libfontconfig1-dev:i386 \
            libglu1-mesa-dev \
            libglu1-mesa-dev:i386 \
            libvulkan-dev \
            libvulkan-dev:i386 \
            libasound2-dev \
            libasound2-dev:i386 \
            libpulse-dev \
            libpulse-dev:i386 \
            libgstreamer1.0-dev \
            libgstreamer1.0-dev:i386 \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-base1.0-dev:i386 \
            libcups2-dev \
            libcups2-dev:i386 \
            libdbus-1-dev \
            libdbus-1-dev:i386 \
            libudev-dev \
            libudev-dev:i386

      - name: Generate configure (if needed)
        run: |
          if [ -f autogen.sh ]; then
            chmod +x autogen.sh
            ./autogen.sh
          fi

      - name: Create build directory
        run: mkdir -p build

      - name: Configure WoW64
        run: |
          cd build

          ../configure \
            --enable-archs=i386,x86_64

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Install
        run: |
          cd build
          make install DESTDIR="${GITHUB_WORKSPACE}/package"

      - name: Create archive
        run: |
          cd package
          tar -czf "${GITHUB_WORKSPACE}/wine-cachyos-wow64.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-cachyos-wow64
          path: wine-cachyos-wow64.tar.gz
          retention-days: 30
